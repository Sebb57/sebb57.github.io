<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="prefetch" as="image" href="/images/maxwell.webp" />

    <link rel="icon" href="/images/favicon.png" />
    <style>{% include style.css %}</style>

    <script src="/js/switch_img.js" defer></script>

    <meta
      name="google-site-verification"
      content="bK76QSrogeccFYpHCsLrrmrYvSQIIUDYSLFcoAmzeZ0"
    />
    {% seo %}
  </head>
  <body>
    <div class="main_window">
      <div class="window_header"></div>
      <div class="window_body">
        <nav class="menu">
          <img
            alt="image of my cat"
            class="profile_pic"
            fetchpriority="high"
            width="280"
            height="200"
            src="/images/gros_chat.jpg"
            onclick="
              switch_img(this, '/images/maxwell.webp', 'gif of spinning cat')
            "
          />
          <a href="/">home</a>
          &nbsp; <a href="/blog/">blog</a> &nbsp;
          <a href="/pages/guestbook.html">guestbook</a> &nbsp;
          <a href="/pages/contact.html">contact</a>
        </nav>
        <hr />
        <main class="content">{{ content }}</main>
      </div>
    </div>

    <div class="folder">
      <a href="/pages/random.html"
        ><img
          alt="image of warframe pom2 folder"
          width="112"
          height="103"
          src="/images/folder.png"
      /></a>
      <p>Random stuff...</p>
    </div>

    <div class="webring">
      <a
        href="https://webring.dinhe.net/prev/https://sebb57.github.io/"
        ><img
          alt="arrow pointing left used to go to previous webring page"
          width="32"
          height="32"
          src="/images/retro_webring/prev.png"
      /></a>
      <a href="https://webring.dinhe.net/"
        ><img
          alt="small earth logo used to go to webring page"
          width="32"
          height="32"
          src="/images/retro_webring/retro_webring.png"
      /></a>
      <a
        href="https://webring.dinhe.net/next/https://sebb57.github.io/"
        ><img
          alt="arrow pointing left used to go to next webring page"
          width="32"
          height="32"
          src="/images/retro_webring/next.png"
      /></a>
    </div>
  </body>
</html>
